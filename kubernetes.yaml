apiVersion: apps/v1
kind: Deployment
metadata:
  name: picas-fijas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: picas-fijas
  template:
    metadata:
      labels:
        app: picas-fijas
    spec:
      containers:
        - name: picas-fijas
          image: alejandrorr33/picas-fijas:1.1
          ports:
            - containerPort: 5000

---

apiVersion: v1
kind: Service
metadata:
  name: picas-fijas
spec:
  type: NodePort
  selector:
    app: picas-fijas
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
